<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频工作台</title>
<style>
  :root {
    --bg: #11161c;
    --header: #1b2229;
    --sidebar: #171e25;
    --panel: #1c242c;
    --panel-soft: #202a33;
    --field: #141a20;
    --line: #303b45;
    --text: #e7edf3;
    --muted: #8d99a5;
    --muted-2: #6e7b86;
    --brand: #4297f5;
    --brand-hover: #5aa4fb;
    --selected: #2c4353;
    --warn: #e0ad52;
    --danger: #f07c7c;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body.light {
    --bg: #f3f6f8;
    --header: #fff;
    --sidebar: #f8fafb;
    --panel: #fff;
    --panel-soft: #f0f4f7;
    --field: #fff;
    --line: #d7e0e7;
    --text: #1e2a33;
    --muted: #71808c;
    --muted-2: #8e9aa4;
    --selected: #dbeaf5;
    --brand: #247fdb;
    --brand-hover: #176fc6;
  }

  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .48; }
  .hidden { display: none !important; }
  .spacer { flex: 1; }

  .topbar {
    height: 68px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 30px;
    background: var(--header);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .logo {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: #42677d;
    color: #f5fbff;
    font-weight: 700;
    font-size: 17px;
  }
  .brand-name { font-size: 17px; font-weight: 650; white-space: nowrap; }
  .brand-sub { color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 22px; color: var(--muted); }
  .points { color: var(--text); white-space: nowrap; }
  .who { color: var(--muted-2); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

  .theme-switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .theme-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-track { position: relative; width: 40px; height: 23px; border-radius: 999px; background: var(--brand); transition: background .18s ease; }
  .switch-track::after { content: ""; position: absolute; top: 3px; left: 20px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left .18s ease; }
  .theme-switch input:not(:checked) + .switch-track { background: #61717d; }
  .theme-switch input:not(:checked) + .switch-track::after { left: 3px; }
  .logout { padding: 4px 0; border: 0; background: transparent; color: var(--muted); }
  .logout:hover { color: var(--text); }

  .app-body { min-height: calc(100vh - 68px); display: grid; grid-template-columns: 208px minmax(0, 1fr); }
  .sidebar { display: flex; flex-direction: column; min-height: calc(100vh - 68px); padding: 26px 15px 22px; background: var(--sidebar); border-right: 1px solid var(--line); }
  .nav { display: grid; gap: 7px; }
  .nav-item { width: 100%; padding: 11px 17px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; font-size: 16px; transition: background .15s ease, color .15s ease; }
  .nav-item:hover { color: var(--text); background: var(--panel-soft); }
  .nav-item.active { background: var(--selected); color: #b9d6e8; font-weight: 600; }
  .sidebar-note { margin-top: auto; padding: 0 14px; color: var(--muted); font-size: 12px; line-height: 1.9; }

  .main { min-width: 0; padding: 38px 36px 56px; }
  .page { max-width: 100%; }
  .page-head { display: flex; align-items: flex-end; gap: 20px; margin: 0 auto 28px; max-width: 100%; }
  .page-head h1 { margin: 0; font-size: 29px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }
  .kicker { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
  .page-head-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 5px 18px rgba(0,0,0,.06); }
  .task-panel { overflow: hidden; }
  .panel-top { display: flex; align-items: center; gap: 14px; padding: 20px 20px 15px; color: var(--muted); }
  .panel-top .primary { margin-left: auto; }
  .panel-footer { display: flex; align-items: center; gap: 10px; padding: 18px 20px; color: var(--muted); border-top: 1px solid var(--line); }
  .panel-footer > div { display: flex; gap: 10px; margin-left: auto; }

  .primary, .ghost, .text-button, .danger-button { border-radius: 7px; padding: 8px 16px; border: 1px solid transparent; white-space: nowrap; }
  .primary { background: var(--brand); color: #fff; font-weight: 600; }
  .primary:hover { background: var(--brand-hover); }
  .ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .ghost:hover { border-color: var(--brand); color: #9fcfff; }
  .text-button { padding: 3px 5px; border: 0; background: transparent; color: #76bbff; }
  .text-button:hover { color: var(--brand-hover); }
  .danger-button { padding: 3px 5px; border: 0; background: transparent; color: var(--danger); }
  .small { padding: 5px 10px; font-size: 12px; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 920px; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 15px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; }
  td { color: var(--text); }
  tbody tr:last-child td { border-bottom: 0; }
  td.id { color: #cdd7df; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.explain { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-tag { display: inline-flex; align-items: center; min-height: 23px; padding: 1px 9px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
  .status-succeeded { color: #62b7ff; border-color: #244b6a; background: #152b3b; }
  .status-processing { color: var(--warn); border-color: #664e26; background: #2b2416; }
  .status-failed { color: #f09b9b; border-color: #633538; background: #301c20; }
  .status-queued { color: var(--muted); background: var(--panel-soft); }
  .status-actions { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .empty-row td { padding: 54px 20px; text-align: center; color: var(--muted); }
  .empty-row strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 16px; }

  .form-panel { width: min(840px, 100%); padding: 25px 25px 27px; }
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--text); font-weight: 600; }
  .field-label small { color: var(--muted); font-weight: 400; }
  textarea, input[type="text"], input[type="password"], select { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--field); color: var(--text); outline: none; padding: 10px 12px; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(66,151,245,.12); }
  input:disabled { opacity: 1; background: var(--field); color: var(--muted); -webkit-text-fill-color: var(--muted); }
  input::placeholder, textarea::placeholder { color: var(--muted-2); }
  select { appearance: auto; }
  .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .disabled-field { color: var(--muted); cursor: not-allowed; }
  .input-suffix { position: relative; }
  .input-suffix span { position: absolute; top: 9px; right: 12px; color: var(--muted); pointer-events: none; }
  .input-suffix input { padding-right: 48px; }
  .upload-box { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 14px; border: 1px dashed #51616d; border-radius: 7px; color: var(--muted); background: rgba(20, 26, 32, .38); }
  .upload-box input { display: none; }
  .upload-copy { min-width: 0; }
  .upload-copy strong { display: block; margin-bottom: 2px; color: var(--text); font-size: 13px; }
  .upload-copy span { font-size: 12px; }
  .image-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 9px; margin-top: 10px; }
  .image-item { position: relative; overflow: hidden; height: 96px; border: 1px solid var(--line); border-radius: 7px; background: var(--field); }
  .image-item img { width: 100%; height: 100%; object-fit: cover; }
  .image-item span { position: absolute; left: 6px; right: 6px; bottom: 5px; overflow: hidden; color: #fff; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px #000; }
  .image-remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; }
  .info-box { margin-top: 20px; padding: 11px 13px; border-radius: 7px; color: var(--muted); background: var(--panel-soft); font-size: 12px; }
  .info-box.warning { color: #e9c985; border: 1px solid #5f4a26; background: #2b2418; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .error-box { margin-top: 14px; padding: 10px 12px; border-radius: 7px; color: #ffc0c0; border: 1px solid #633538; background: #301c20; white-space: pre-wrap; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .toolbar input { max-width: 320px; }
  .material-count { color: var(--muted); }
  .material-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 14px; }
  .material-card { min-height: 164px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .material-card h3 { margin: 0 0 8px; font-size: 15px; }
  .material-card p { display: -webkit-box; overflow: hidden; margin: 0 0 14px; color: var(--muted); font-size: 13px; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
  .material-card footer { display: flex; gap: 10px; align-items: center; }
  .empty-card { padding: 58px 24px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted); }
  .empty-card strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }

  .redeem-panel { width: min(760px, 100%); padding: 25px; }
  .redeem-panel h2 { margin: 0 0 8px; font-size: 18px; }
  .redeem-panel p { margin: 0 0 22px; color: var(--muted); }
  .redeem-row { display: flex; gap: 10px; }

  dialog { width: min(760px, calc(100vw - 32px)); max-width: 100%; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.68); }
  .dialog-head { display: flex; align-items: center; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
  .dialog-head strong { font-size: 16px; }
  .dialog-body { padding: 20px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  video { display: block; width: 100%; max-height: 68vh; border-radius: 7px; background: #000; }
  pre { overflow: auto; max-height: 55vh; margin: 0; padding: 14px; border-radius: 7px; background: var(--field); color: var(--muted); font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .picker-list { display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
  .picker-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 7px; }
  .picker-item > div { min-width: 0; flex: 1; }
  .picker-item strong, .picker-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-item span { color: var(--muted); font-size: 12px; }

  .login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(400px, 100%); padding: 30px 27px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .login-card .logo { width: 46px; height: 46px; margin: 0 auto 15px; border-radius: 11px; font-size: 21px; }
  .login-card h1 { margin: 0; text-align: center; font-size: 20px; }
  .login-card p { margin: 6px 0 24px; text-align: center; color: var(--muted); }
  .login-card input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .login-card .primary { width: 100%; margin-top: 14px; }
  .login-tip { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.9; }
  .login-tip code { padding: 1px 5px; border-radius: 4px; background: var(--field); }
  .toast { position: fixed; z-index: 20; right: 25px; bottom: 25px; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); box-shadow: 0 8px 28px rgba(0,0,0,.28); }

  @media (max-width: 840px) {
    .topbar { padding: 0 17px; }
    .brand-sub, .who { display: none; }
    .top-actions { gap: 12px; }
    .app-body { display: block; }
    .sidebar { min-height: 0; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .nav { display: flex; overflow-x: auto; gap: 5px; }
    .nav-item { width: auto; flex: 0 0 auto; padding: 8px 13px; font-size: 14px; white-space: nowrap; }
    .sidebar-note { display: none; }
    .main { padding: 26px 16px 42px; }
    .page-head { align-items: flex-start; margin-bottom: 20px; }
    .page-head h1 { font-size: 25px; }
    .page-head-actions { gap: 6px; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
    .form-panel, .redeem-panel { padding: 19px; }
    .panel-top { padding: 15px; }
    .panel-footer { padding: 14px 15px; }
    .top-actions .points { font-size: 12px; }
  }
  @media (max-width: 520px) {
    .topbar { height: 60px; }
    .app-body, .sidebar { min-height: calc(100vh - 60px); }
    .logo { width: 30px; height: 30px; }
    .brand-name { font-size: 15px; }
    .theme-switch { gap: 0; }
    .logout { display: none; }
    .page-head { display: block; }
    .page-head-actions { margin-top: 14px; justify-content: flex-start; }
    .redeem-row { display: grid; }
    .redeem-row .primary { width: 100%; }
  }
</style>
</head>
<body>
<div id="loginView" class="login-page hidden">
  <div class="login-card">
    <div class="logo">V</div>
    <h1>视频工作台</h1>
    <p>输入访问令牌，开始创作 10 / 15 / 20 / 30 秒视频</p>
    <form id="loginForm">
      <input id="credInput" type="password" placeholder="dv_xxxxxxxx" autocomplete="off">
      <div id="loginErr" class="error-box hidden"></div>
      <button id="loginBtn" class="primary" type="submit">登录</button>
    </form>
    <div class="login-tip">令牌由管理员发放，以 <code>dv_</code> 开头。你的任务和积分与其他用户隔离。</div>
  </div>
</div>

<div id="appView" class="hidden">
  <header class="topbar">
    <div class="brand"><div class="logo">V</div><span class="brand-name">视频工作台</span><span class="brand-sub">创作空间</span></div>
    <div class="spacer"></div>
    <div class="top-actions"><span id="balance" class="points">积分 —</span><label class="theme-switch" title="切换主题"><input id="themeToggle" type="checkbox" checked><span class="switch-track"></span></label><span id="who" class="who"></span><button id="logoutBtn" class="logout">退出</button></div>
  </header>
  <div class="app-body">
    <aside class="sidebar"><nav id="sideNav" class="nav" aria-label="主导航"><button class="nav-item active" data-page="tasks">我的任务</button><button class="nav-item" data-page="create">创建视频</button><button class="nav-item" data-page="materials">素材库</button><button class="nav-item" data-page="redeem">积分兑换</button></nav><div class="sidebar-note">简单、专注地完成每一次创作。</div></aside>
    <main id="main" class="main"></main>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<dialog id="previewDlg"><div class="dialog-head"><strong id="previewTitle">预览</strong><div class="spacer"></div><button class="ghost small" data-dialog-close="previewDlg">关闭</button></div><div class="dialog-body"><video id="previewVideo" controls autoplay playsinline></video></div></dialog>
<dialog id="detailDlg"><div class="dialog-head"><strong>任务详情</strong><div class="spacer"></div><button class="ghost small" data-dialog-close="detailDlg">关闭</button></div><div class="dialog-body"><pre id="detailText"></pre></div></dialog>
<dialog id="materialPickerDlg"><div class="dialog-head"><strong>从素材库选用</strong><div class="spacer"></div><button class="ghost small" data-dialog-close="materialPickerDlg">关闭</button></div><div class="dialog-body"><div id="pickerList" class="picker-list"></div></div></dialog>
<dialog id="materialEditDlg"><div class="dialog-head"><strong id="materialEditTitle">新增素材</strong><div class="spacer"></div><button class="ghost small" data-dialog-close="materialEditDlg">关闭</button></div><div class="dialog-body"><div class="field"><div class="field-label"><label for="materialName">素材名称</label></div><input id="materialName" type="text" maxlength="80" placeholder="例如：雨夜街头"></div><div class="field"><div class="field-label"><label for="materialPrompt">提示词</label><small>最多 12000 字</small></div><textarea id="materialPrompt" maxlength="12000" placeholder="描述场景、人物、动作与镜头语言"></textarea></div><div id="materialEditErr" class="error-box hidden"></div><div class="dialog-actions"><button class="ghost" data-dialog-close="materialEditDlg">取消</button><button id="materialSaveBtn" class="primary">保存素材</button></div></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const main = $('#main');
const DEFAULT_SECONDS = 30;
const FALLBACK_SECONDS = [30];
const FALLBACK_EXPERT_SECONDS = [];
const DEFAULT_MODE = 'standard';
const TOKEN_KEY = 'video_workbench_token';
const FORCE_LOGIN_KEY = 'video_workbench_force_login';
const THEME_KEY = 'video_workbench_theme';
const ZH = { queued: '排队中', processing: '处理中', succeeded: '已成功', failed: '已失败', unknown: '未知' };
const state = { page: 'tasks', tasks: [], session: null, health: null, mode: DEFAULT_MODE, seconds: DEFAULT_SECONDS, materials: [], materialKey: 'video_workbench_materials_local', materialSearch: '', editingMaterialId: null, selectedImages: [], currentVideoUrl: null, toastTimer: null };
const polling = { timer: null, running: false, stopped: true, epoch: 0, failures: 0, controller: null, balancePending: false };
const taskRequests = new Map();
let refreshPromise = null;
let healthRefreshPromise = null;

const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = (t) => t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY);
const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const idOf = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);

function showToast(message, duration = 3200) { const el = $('#toast'); el.textContent = message; el.classList.remove('hidden'); clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => el.classList.add('hidden'), duration); }
function showLogin(message = '') { stopPolling(); state.session = null; state.tasks = []; closeDialog('previewDlg'); closeDialog('detailDlg'); $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); const err = $('#loginErr'); err.textContent = message; err.classList.toggle('hidden', !message); setTimeout(() => $('#credInput')?.focus(), 50); }
function showApp() { $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden'); }
function authHeaders() { const token = getToken(); return token ? { Authorization: 'Bearer ' + token } : {}; }
async function api(path, options = {}) {
  const { timeoutMs = 20000, signal, ...request } = options;
  const controller = new AbortController();
  const abort = () => controller.abort();
  const token = getToken();
  const timer = setTimeout(abort, timeoutMs);
  if (signal?.aborted) abort();
  signal?.addEventListener('abort', abort, { once: true });
  try {
    const response = await fetch(path, { ...request, signal: controller.signal, headers: { ...authHeaders(), ...(request.headers || {}) } });
    const body = await response.json().catch(() => ({}));
    if ([401, 403].includes(response.status) && body.needLogin && token === getToken()) { setToken(''); showLogin(body.message || '登录已失效，请重新登录'); }
    if (!response.ok) throw Object.assign(new Error(body.message || `请求失败（HTTP ${response.status}）`), { status: response.status, code: body.code, submissionUnknown: body.submissionUnknown });
    return body;
  } finally { clearTimeout(timer); signal?.removeEventListener('abort', abort); }
}
function updateBalance(value) { if (value != null) $('#balance').textContent = `积分 ${value}`; }
function formatDate(value) { if (!value) return '—'; const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { hour12: false }); }
function statusClass(status) { return ['queued', 'processing', 'succeeded', 'failed'].includes(status) ? status : 'queued'; }
function taskExplain(task) { return task.error || task.stage || task.notice || (task.seconds ? `${task.seconds} 秒视频` : '视频任务'); }
function promptMax() { return Number(state.health?.promptMax || 12000); }
function imagesSupported() { return state.health?.referenceImagesSupported === true; }
function supportedSeconds() {
  const raw = Array.isArray(state.health?.supportedSeconds) ? state.health.supportedSeconds : FALLBACK_SECONDS;
  return [...new Set(raw.map(Number).filter((value) => Number.isInteger(value) && [10, 15, 20, 30].includes(value)))].sort((a, b) => a - b);
}
function expertSeconds() {

async function previewTask(id) { showToast('正在加载视频…', 1200); const blob = await mediaBlob(id, 'media'); if (state.currentVideoUrl) URL.revokeObjectURL(state.currentVideoUrl); state.currentVideoUrl = URL.createObjectURL(blob); $('#previewTitle').textContent = `预览 · ${id}`; $('#previewVideo').src = state.currentVideoUrl; $('#previewDlg').showModal(); }
async function downloadTask(id) { showToast('正在准备下载…', 1200); const blob = await mediaBlob(id, 'download'); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `${id}.mp4`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
async function redeemCard(event) { event.preventDefault(); const input = $('#cardInput'); const error = $('#redeemError'); error.classList.add('hidden'); const card = input.value.trim(); if (!card) { error.textContent = '请输入卡密'; error.classList.remove('hidden'); return; } const button = event.submitter; button.disabled = true; button.textContent = '兑换中…'; try { const result = await api('/api/redeem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ card }) }); updateBalance(result.balance ?? result.tokenPoints); input.value = ''; showToast(`兑换成功，增加 ${result.points ?? 0} 积分`); } catch (err) { error.textContent = err.message; error.classList.remove('hidden'); } finally { button.disabled = false; button.textContent = '确认兑换'; } }

async function handleMainClick(event) { const button = event.target.closest('[data-action]'); if (!button) return; const action = button.dataset.action; try { if (action === 'go-create') setActivePage('create'); if (action === 'refresh-tasks') await refreshTasks(true); if (action === 'refresh-health') { button.disabled = true; button.textContent = '检查中…'; const health = await refreshHealth({ render: true }); showToast(health?.fixedSecondsReady === true && health?.expertSecondsReady === true ? '已确认原生 15 / 30 秒账号；10 / 20 秒仍按页面原生选项检查' : health?.expertSecondsReady === true ? '已确认原生 15 秒账号；30 秒原生能力仍未确认' : '15 / 30 秒原生能力仍未确认；请先在后台账号池完成只读探测'); } if (action === 'query') await showTaskDetail(button.dataset.id); if (action === 'preview') await previewTask(button.dataset.id); if (action === 'download') await downloadTask(button.dataset.id); if (action === 'delete') { if (!confirm('确定删除这个任务吗？')) return; await api(`/api/tasks/${encodeURIComponent(button.dataset.id)}`, { method: 'DELETE' }); await refreshTasks(); showToast('任务已删除'); } if (action === 'remove-image') { state.selectedImages.splice(Number(button.dataset.index), 1); renderCreatePage(); } if (action === 'pick-material') openMaterialPicker(); if (action === 'save-material') await saveCurrentAsMaterial(); if (action === 'new-material') openMaterialEditor(); if (action === 'material-use' || action === 'picker-use') useMaterial(button.dataset.id); if (action === 'material-edit') openMaterialEditor(button.dataset.id); if (action === 'material-delete') { if (!confirm('确定删除这个素材吗？')) return; state.materials = state.materials.filter((item) => item.id !== button.dataset.id); saveMaterials(); renderMaterialsPage(); showToast('素材已删除'); } } catch (error) { showToast(error.message); } }
function handleMainChange(event) { if (event.target.id === 'imageInput') onImagesSelected(event.target.files); if (event.target.id === 'generationMode') { state.mode = event.target.value; updateCreateReadiness(); } if (event.target.id === 'seconds') { state.seconds = Number(event.target.value); updateCreateReadiness(); } }
function handleMainInput(event) { if (event.target.id === 'materialSearch') { state.materialSearch = event.target.value; renderMaterialsPage(); $('#materialSearch')?.focus(); } }
async function doLogin() { const input = $('#credInput'); const error = $('#loginErr'); const credential = input.value.trim(); error.classList.add('hidden'); if (!credential) { error.textContent = '请输入访问令牌'; error.classList.remove('hidden'); return; } const button = $('#loginBtn'); button.disabled = true; button.textContent = '验证中…'; try { const response = await fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential }) }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.message || `登录失败（HTTP ${response.status}）`); setToken(credential); localStorage.removeItem(FORCE_LOGIN_KEY); location.reload(); } catch (err) { error.textContent = err.message; error.classList.remove('hidden'); } finally { button.disabled = false; button.textContent = '登录'; } }

async function boot() {
  const savedTheme = localStorage.getItem(THEME_KEY) || 'dark'; document.body.classList.toggle('light', savedTheme === 'light'); $('#themeToggle').checked = savedTheme !== 'light'; $('#themeToggle').addEventListener('change', (event) => { const dark = event.target.checked; document.body.classList.toggle('light', !dark); localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); });
  $('#loginForm').addEventListener('submit', (event) => { event.preventDefault(); doLogin(); }); $('#logoutBtn').addEventListener('click', () => { localStorage.setItem(FORCE_LOGIN_KEY, '1'); setToken(''); showLogin(); }); $('#sideNav').addEventListener('click', (event) => { const item = event.target.closest('[data-page]'); if (item) setActivePage(item.dataset.page); });
  main.addEventListener('click', handleMainClick); main.addEventListener('change', handleMainChange); main.addEventListener('input', handleMainInput); main.addEventListener('submit', (event) => { if (event.target.id === 'createForm') submitCreate(event); if (event.target.id === 'redeemForm') redeemCard(event); }); document.body.addEventListener('click', (event) => { const close = event.target.closest('[data-dialog-close]'); if (close) closeDialog(close.dataset.dialogClose); }); $('#materialSaveBtn').addEventListener('click', saveMaterialEditor); $('#previewDlg').addEventListener('close', () => { $('#previewVideo').pause(); $('#previewVideo').removeAttribute('src'); if (state.currentVideoUrl) { URL.revokeObjectURL(state.currentVideoUrl); state.currentVideoUrl = null; } });
  let session; try { session = await api('/api/session'); } catch (error) { showLogin(error.message); return; } if (!session.authenticated || (localStorage.getItem(FORCE_LOGIN_KEY) === '1' && !getToken())) { showLogin(); return; }
  state.session = session; state.materialKey = materialKeyFor(session); loadMaterials(); showApp(); $('#who').textContent = session.credentialPrefix || ''; $('#who').title = session.source === 'default' ? '当前使用服务端默认令牌' : '当前使用你的访问令牌'; updateBalance(session.balance); await refreshHealth(); setActivePage('tasks'); await refreshTasks();
}
boot();
</script>
</body>
